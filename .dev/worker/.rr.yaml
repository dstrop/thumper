version: '3'
rpc:
    listen: 'tcp://127.0.0.1:6001'

metrics:
    address: 0.0.0.0:2112

server:
    command: 'php consumer.php'
    relay: pipes

thumper:
  pool:
    num_workers: 1

    supervisor:
      ttl: 2h
      idle_ttl: 30m
      exec_ttl: 10m
      max_worker_memory: 800

  x-default-consumer: &default-consumer
    concurrency: 1
    prefetch: 10
    durable: true

  consumers:
    queue1:
      <<: *default-consumer
    queue2:
      <<: *default-consumer

  amqp:
    addr: amqp://user:password@rabbitmq:5672

    exchange:
      exchange1:
        kind: direct
        durable: true
        args:
          x-key1: value1
          x-key2: value2
      exchange2:
        kind: direct
        durable: true
        args:
          x-key1: value1
          x-key2: value2

    queue:
      queue1:
        durable: true
        args:
          x-key1: value1
          x-key2: value2
        bindings:
          exchange1:
            key: key1
            args:
              x-key1: value1
              x-key2: value2
      queue2:
        durable: true
        args:
          x-key1: value1
          x-key2: value2
        bindings:
          exchange2:
            key: key2
            args:
              x-key1: value1
              x-key2: value2
