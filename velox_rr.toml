[roadrunner]
ref = "v3.0.1"

[debug]
enabled = false

[log]
level = "debug"
mode = "production"

[github.token]
token = "${RT_TOKEN}"

[plugins]
lock = { module_name = "github.com/roadrunner-server/lock/v6", tag = "v6.0.0" }
logger = { module_name = "github.com/roadrunner-server/logger/v6", tag = "v6.0.0" }
appLogger = { module_name = "github.com/roadrunner-server/app-logger/v6", tag = "v6.0.0" }
metrics = { module_name = "github.com/roadrunner-server/metrics/v6", tag = "v6.0.0" }
rpc = { module_name = "github.com/roadrunner-server/rpc/v6", tag = "v6.0.0" }
server = { module_name = "github.com/roadrunner-server/server/v6", tag = "v6.0.0" }
service = { module_name = "github.com/roadrunner-server/service/v6", tag = "v6.0.0" }
centrifuge = { module_name = "github.com/roadrunner-server/centrifuge/v6", tag = "v6.0.0" }
jobs = { module_name = "github.com/roadrunner-server/jobs/v6", tag = "v6.0.1" }
amqp = { module_name = "github.com/roadrunner-server/amqp/v6", tag = "v6.0.0" }
sqs = { module_name = "github.com/roadrunner-server/sqs/v6", tag = "v6.0.0" }
nats = { module_name = "github.com/roadrunner-server/nats/v6", tag = "v6.0.0" }
kafka = { module_name = "github.com/roadrunner-server/kafka/v6", tag = "v6.0.0" }
beanstalk = { module_name = "github.com/roadrunner-server/beanstalk/v6", tag = "v6.0.0" }
googlePubSub = { module_name = "github.com/roadrunner-server/google-pub-sub/v6", tag = "v6.0.0" }
nsq = { module_name = "github.com/roadrunner-server/nsq/v6", tag = "v6.0.0" }
http = { module_name = "github.com/roadrunner-server/http/v6", tag = "v6.0.0" }
static = { module_name = "github.com/roadrunner-server/static/v6", tag = "v6.0.0" }
headers = { module_name = "github.com/roadrunner-server/headers/v6", tag = "v6.0.0" }
status = { module_name = "github.com/roadrunner-server/status/v6", tag = "v6.0.0" }
gzip = { module_name = "github.com/roadrunner-server/gzip/v6", tag = "v6.0.0" }
zstd = { module_name = "github.com/roadrunner-server/zstd/v6", tag = "v6.0.0" }
rateLimiter = { module_name = "github.com/roadrunner-server/rate-limiter/v6", tag = "v6.0.0" }
prometheus = { module_name = "github.com/roadrunner-server/prometheus/v6", tag = "v6.0.0" }
send = { module_name = "github.com/roadrunner-server/send/v6", tag = "v6.0.0" }
proxyIPParser = { module_name = "github.com/roadrunner-server/proxy_ip_parser/v6", tag = "v6.0.0" }
otel = { module_name = "github.com/roadrunner-server/otel/v6", tag = "v6.0.0" }
fileserver = { module_name = "github.com/roadrunner-server/fileserver/v6", tag = "v6.0.0" }
grpc = { module_name = "github.com/roadrunner-server/grpc/v6", tag = "v6.0.0" }
protoreg = { module_name = "github.com/roadrunner-server/protoreg/v6", tag = "v6.0.0" }
memory = { module_name = "github.com/roadrunner-server/memory/v6", tag = "v6.0.0" }
boltdb = { module_name = "github.com/roadrunner-server/boltdb/v6", tag = "v6.0.0" }
kv = { module_name = "github.com/roadrunner-server/kv/v6", tag = "v6.0.0" }
memcached = { module_name = "github.com/roadrunner-server/memcached/v6", tag = "v6.0.0" }
redis = { module_name = "github.com/roadrunner-server/redis/v6", tag = "v6.0.0" }
temporal = { module_name = "github.com/temporalio/roadrunner-temporal/v6", tag = "v6.0.0" }

[plugins.thumper]
module_name = "github.com/dstrop/thumper"
tag = "master"

# build thumper from the local checkout instead of the published module
[[replaces]]
old = "github.com/dstrop/thumper"
new = "/plugin"
