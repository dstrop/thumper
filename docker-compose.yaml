services:
  rabbitmq:
    image: rabbitmq:4.3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 20

  consumer:
    build:
      context: .dev
      dockerfile: Dockerfile
      args:
          GO_VERSION: 1.27.3
    image: thumper-php:latest

    volumes:
      - .:/plugin
      - go-pkg:/root/go/pkg
      - go-cache:/root/.cache
      - docker-cache:/.composer
    environment:
      COMPOSER_CACHE_DIR: /.composer/cache
    ports:
      - "2112:2112"
    depends_on:
      rabbitmq:
        condition: service_healthy
    working_dir: /plugin/.dev/worker

    command: ./consumer.sh

  velox:
    build:
      context: .dev
      dockerfile: Dockerfile.velox
    volumes:
      - .:/plugin
      - go-pkg:/root/go/pkg
      - go-cache:/root/.cache
    working_dir: /plugin
    entrypoint:
      - /bin/sh
      - -euc
      - |
        cp velox_rr.toml /tmp/velox.toml
        if [ -n "$${GOARCH:-}" ]; then
          printf '\n[target_platform]\nos = "linux"\narch = "%s"\n' "$$GOARCH" >> /tmp/velox.toml
        fi
        exec vx build -c /tmp/velox.toml -o /plugin
    env_file:
      - .env

volumes:
  go-cache:
  go-pkg:
  docker-cache:
