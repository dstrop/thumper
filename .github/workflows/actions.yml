on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  packages: write
  contents: write

jobs:
  php-lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer

      - name: Install Composer dependencies
        run: composer install --no-scripts --no-progress --no-interaction

      - name: Run phpcs
        run: composer phpcs

      - name: Run phpstan
        run: composer phpstan

  go-lint:
    runs-on: ubuntu-latest
    container:
      image: golangci/golangci-lint:v2.15.0-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Go linters
        run: golangci-lint run ./...

  go-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: [php-lint, go-lint, go-test]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        platform: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compile binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .env
          docker compose run --rm --no-deps \
              -e RT_TOKEN="$GITHUB_TOKEN" \
              -e GOARCH=${{ matrix.platform }} \
            velox

      - name: Rename release asset
        run: mv ./rr ./rr-${{ matrix.platform }}

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: rr-binary-${{ matrix.platform }}
          path: ./rr-${{ matrix.platform }}

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Binary (amd64)
        uses: actions/download-artifact@v8
        with:
          name: rr-binary-amd64
          path: ./

      - name: Download Binary (arm64)
        uses: actions/download-artifact@v8
        with:
          name: rr-binary-arm64
          path: ./

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Download Binary (amd64)
        uses: actions/download-artifact@v8
        with:
          name: rr-binary-amd64
          path: ./artifact

      - name: Download Binary (arm64)
        uses: actions/download-artifact@v8
        with:
          name: rr-binary-arm64
          path: ./artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifact/rr-amd64
            ./artifact/rr-arm64
          body: 'Docker image available at [ghcr.io/${{ github.repository }}](https://ghcr.io/${{ github.repository }})'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}